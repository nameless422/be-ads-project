name: Harness Feature Request
description: Describe a feature or change using the project Harness entrypoints.
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change, and why?
      placeholder: Describe the user-visible or system-visible outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which areas are affected?
      placeholder: Backend, frontend, storage, messaging, scripts, docs.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What should not be changed in this task?
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true before this can be marked done?
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation Plan
      description: Which checks should run?
      value: |
        - [ ] make harness-check
        - [ ] make test
        - [ ] make verify
        - [ ] make verify-debezium
        - [ ] Frontend build / browser verification:
    validations:
      required: true
