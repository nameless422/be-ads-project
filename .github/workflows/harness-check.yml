name: Harness Check

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  harness-check:
    name: make harness-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: be/go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Run harness check
        run: make harness-check
