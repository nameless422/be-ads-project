version: "3.9"

services:
  raw-mysql:
    image: mysql:8.4
    container_name: be-ads-raw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: be_ads_raw
      MYSQL_USER: be_ads
      MYSQL_PASSWORD: be_ads
    ports:
      - "3307:3306"
    volumes:
      - raw_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -ube_ads -pbe_ads --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  serving-mysql:
    image: mysql:8.4
    container_name: be-ads-serving-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: be_ads_serving
      MYSQL_USER: be_ads
      MYSQL_PASSWORD: be_ads
    ports:
      - "3308:3306"
    volumes:
      - serving_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -ube_ads -pbe_ads --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: be-ads-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: be_ads
      CLICKHOUSE_USER: be_ads
      CLICKHOUSE_PASSWORD: be_ads
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user be_ads --password be_ads --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.11
    container_name: be-ads-nats
    restart: unless-stopped
    command:
      - "--js"
      - "--sd=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.125.0
    container_name: be-ads-otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./deploy/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

volumes:
  raw_mysql_data:
  serving_mysql_data:
  clickhouse_data:
  nats_data:
